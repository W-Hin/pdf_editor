name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Build the standalone exe (PyInstaller)
        run: >
          pyinstaller --name PDFEditorWeb --onedir --console
          --collect-all uvicorn --collect-all fastapi --collect-all starlette
          --add-data "web/frontend/dist;frontend/dist"
          --add-data "VERSION;."
          -y web/launch.py

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/PDFEditorSetup.exe
          generate_release_notes: true
