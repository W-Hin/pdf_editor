name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install and vendor OCR binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install tesseract ghostscript -y --no-progress

          # Chocolatey's `tesseract` package (like the winget package used on the
          # dev machine) only bundles eng + osd. The other 7 languages this
          # feature promises (see the OCR tool's language checkboxes) are
          # downloaded here from the official tessdata_fast repo and handed to
          # vendor_ocr_binaries.py via TESSDATA_FALLBACK_DIR, the mechanism it
          # already supports for exactly this case.
          $fallbackDir = "$env:RUNNER_TEMP\extra_tessdata"
          New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
          $extraLangs = @("spa", "fra", "deu", "por", "chi_sim", "jpn", "ara")
          foreach ($lang in $extraLangs) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata" -OutFile "$fallbackDir\$lang.traineddata"
          }

          $env:TESSDATA_FALLBACK_DIR = $fallbackDir
          python scripts/vendor_ocr_binaries.py

          # Belt and suspenders: vendor_ocr_binaries.py only warns (does not
          # fail) on missing optional languages, so verify here and fail the
          # build loudly rather than silently shipping partial-language OCR.
          $tessdataDir = "ocr_binaries/tesseract/tessdata"
          $expectedLangs = @("eng", "osd", "spa", "fra", "deu", "por", "chi_sim", "jpn", "ara")
          $missing = $expectedLangs | Where-Object { -not (Test-Path "$tessdataDir/$_.traineddata") }
          if ($missing.Count -gt 0) {
            throw "Vendored tessdata is missing language file(s): $($missing -join ', '). Expected all $($expectedLangs.Count) languages under $tessdataDir."
          }
          Write-Output "Verified all $($expectedLangs.Count) tessdata languages are present: $($expectedLangs -join ', ')"

      - name: Run the test suite
        run: pytest -q

      - name: Build the frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Build the standalone exe (PyInstaller)
        run: >
          pyinstaller --name PDFEditorWeb --onedir --console
          --collect-all uvicorn --collect-all fastapi --collect-all starlette
          --add-data "web/frontend/dist;frontend/dist"
          --add-data "VERSION;."
          --add-data "ocr_binaries;ocr_binaries"
          -y web/launch.py

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Output "ISCC.exe not found at the expected preinstalled path — installing via choco..."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe still not found at $iscc after the choco install attempt."
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/PDFEditorSetup.exe
          generate_release_notes: true
